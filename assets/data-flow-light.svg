<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Data path: four accelerometers on the participant, an Arduino UNO R4 Minima, a host model that scores each session">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F3330"/></marker>
<marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C4623F"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4E7A5E"/></marker>
</defs>
<rect width="1200" height="400" rx="14" fill="#FDF6EC"/>
<rect x="28" y="52" width="246" height="284" rx="12" fill="none" stroke="#C9BDA9" stroke-width="1.5"/>
<text x="46" y="78" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.2" fill="#7A746C">ON THE PARTICIPANT</text>
<rect x="300" y="52" width="440" height="284" rx="12" fill="none" stroke="#C9BDA9" stroke-width="1.5"/>
<text x="318" y="78" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.2" fill="#7A746C">LOCAL DEVICE</text>
<rect x="766" y="52" width="406" height="284" rx="12" fill="none" stroke="#B9AE9C" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="784" y="78" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.2" fill="#7A746C">HOST COMPUTER  ·  PLANNED</text>
<line x1="250" y1="174" x2="326" y2="174" stroke="#2F3330" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="288" y="164" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#7A746C" text-anchor="middle">analog</text>
<line x1="596" y1="150" x2="790" y2="150" stroke="#B9AE9C" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="693" y="140" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#7A746C" text-anchor="middle">WiFi or serial</text>
<line x1="461" y1="244" x2="461" y2="268" stroke="#4E7A5E" stroke-width="1.6" marker-end="url(#arg)"/>
<rect x="52" y="104" width="198" height="140" rx="8" fill="#FDEFE7" stroke="#C4623F" stroke-width="1.6"/>
<text x="70" y="134" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#C4623F" text-anchor="start">4 × ADXL335</text>
<text x="70" y="158" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">two per limb, one matched pair</text>
<text x="70" y="180" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">three analog outputs each</text>
<text x="70" y="210" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#2F3330" text-anchor="start">±3 g  ·  strap-on</text>
<rect x="326" y="104" width="270" height="140" rx="8" fill="#FFFFFF" stroke="#2F3330" stroke-width="1.6"/>
<text x="344" y="134" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#2F3330" text-anchor="start">Arduino UNO R4 Minima</text>
<text x="344" y="158" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">RA4M1  ·  48 MHz  ·  5 V</text>
<text x="344" y="180" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">A0–A3 read at about 50 Hz</text>
<text x="344" y="210" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#4E7A5E" text-anchor="start">threshold + hysteresis</text>
<rect x="326" y="268" width="270" height="48" rx="8" fill="#EEF5F0" stroke="#4E7A5E" stroke-width="1.6"/>
<text x="344" y="297" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4E7A5E" text-anchor="start">OLED  ·  reps and pace  ·  3 buttons</text>
<rect x="790" y="104" width="358" height="212" rx="8" fill="#FFFFFF" stroke="#B9AE9C" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="810" y="134" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#7A746C" text-anchor="start">Python model</text>
<text x="810" y="160" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">model/model.py</text>
<text x="810" y="190" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">rep quality  ·  pace  ·  form</text>
<text x="810" y="212" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">writes one summary per session</text>
<text x="810" y="252" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="500" fill="#B9AE9C" text-anchor="start">empty file</text>
<text x="30" y="372" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7A746C" text-anchor="start">Figure 1. Target data path. The repository holds a scaffold: no stage in this figure is complete.</text>
</svg>
